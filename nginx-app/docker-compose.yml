services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./app:/app
    command: ["sh", "-c", "npm install && npm start"]
    environment:
      PORT: 3000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
